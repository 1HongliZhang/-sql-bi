name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: server
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        working-directory: server
        run: pyinstaller server.spec --clean

      - name: Prepare release
        working-directory: server
        run: |
          copy config.json dist\server\
          copy config.example.json dist\server\
          copy install_startup.bat dist\server\
          copy uninstall_startup.bat dist\server\
          copy DEPLOY.md dist\server\
          copy README.md dist\server\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-file-collector
          path: server/dist/server/
          if-no-files-found: error
